[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitshiftlab"
version = "0.1.1"
description = "Research prototype for constrained leakage-aware data splits and distribution-shift diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SplitShiftLab contributors"}]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.2"]
keywords = ["machine-learning", "benchmarking", "evaluation", "data-leakage", "distribution-shift"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
splitshiftlab = "splitshiftlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
